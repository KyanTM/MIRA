<section class="summary panel" aria-labelledby="archive-summary-heading">
  <h2 id="archive-summary-heading" class="sr-only">Inhoud van je archief</h2>

  @for (metric of metrics(); track metric.label) {
    @if (metric.link; as link) {
      <a class="metric metric--link" [attr.data-index]="$index" [routerLink]="link">
        <strong>{{ metric.value }}</strong>
        <span>{{ metric.label }}</span>
      </a>
    } @else {
      <div class="metric" [attr.data-index]="$index">
        <strong>{{ metric.value }}</strong>
        <span>{{ metric.label }}</span>
      </div>
    }
  }
</section>
