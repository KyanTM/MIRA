<div class="page-container form-page">
  @if (isLoading()) {
    <section class="loading-panel panel" aria-busy="true">
      <span class="sr-only">Bezitting wordt geladen</span>
      <span class="loading-line loading-line--title" aria-hidden="true"></span>
      <span class="loading-line" aria-hidden="true"></span>
      <span class="loading-block" aria-hidden="true"></span>
    </section>
  } @else if (notFound()) {
    <section class="not-found panel" role="alert">
      <h1>Bezitting niet gevonden</h1>
      <p>Deze bezitting bestaat niet, is niet beschikbaar of behoort niet tot jouw account.</p>
      <a class="button button--secondary" routerLink="/assets">Terug naar bezittingen</a>
    </section>
  } @else if (loadError(); as message) {
    <app-error-state title="Bezitting niet beschikbaar" [message]="message" (retry)="loadAsset()" />
  } @else if (asset(); as currentAsset) {
    <app-page-header
      title="Bezitting bewerken"
      [description]="'Werk de gegevens van ' + currentAsset.name + ' bij.'"
      [backLink]="'/assets/' + currentAsset.id"
      backLabel="Terug naar detail"
    />

    <app-asset-form
      submitLabel="Wijzigingen opslaan"
      [cancelLink]="'/assets/' + currentAsset.id"
      [asset]="currentAsset"
      [isSubmitting]="isSubmitting()"
      [serverError]="serverError()"
      (imageSelected)="selectedImage.set($event)"
      (submitted)="updateAsset($event)"
    />
  }
</div>
