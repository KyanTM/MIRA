<section class="empty-state">
  <span class="empty-icon" aria-hidden="true">
    <fa-icon [icon]="icon"></fa-icon>
  </span>
  <h2>{{ title() }}</h2>
  <p>{{ description() }}</p>

  @if (actionLabel(); as label) {
    @if (actionLink(); as link) {
      <a class="button button--primary" [routerLink]="link">{{ label }}</a>
    }
  }
</section>
